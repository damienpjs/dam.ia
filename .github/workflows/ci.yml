name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires + couverture (seuil 95 %)
        run: npm run test:ci

  deploy-preview:
    name: Déploiement Preview (Vercel)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer la CLI Vercel
        run: npm i -g vercel@latest

      - name: Déployer la preview (build côté Vercel)
        run: vercel deploy --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Déploiement Production (Vercel)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer la CLI Vercel
        run: npm i -g vercel@latest

      - name: Déployer en production (build côté Vercel)
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
