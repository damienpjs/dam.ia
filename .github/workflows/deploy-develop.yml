name: Deploy Develop

on:
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires + couverture (seuil 95 %)
        run: npm run test:ci

  deploy-develop:
    name: Déploiement Develop (Vercel)
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer la CLI Vercel
        run: npm i -g vercel@latest

      - name: Déployer la preview develop et l'aliaser au domaine de branche
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          GIT_MSG: ${{ github.event.head_commit.message }}
          GIT_ORG: ${{ github.repository_owner }}
          GIT_REPO: ${{ github.event.repository.name }}
        run: |
          DEPLOY_URL=$(vercel deploy --token="$VERCEL_TOKEN" \
            --meta githubCommitRef="$GIT_REF" \
            --meta githubCommitSha="$GIT_SHA" \
            --meta githubCommitMessage="$GIT_MSG" \
            --meta githubCommitOrg="$GIT_ORG" \
            --meta githubCommitRepo="$GIT_REPO")
          echo "Preview develop déployée : $DEPLOY_URL"
          vercel alias set "$DEPLOY_URL" damienpasulj-dev.vercel.app --token="$VERCEL_TOKEN"
